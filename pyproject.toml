[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "partuno"
version = "4.0.1"
description = "Provider-neutral DigiKey and Mouser MCP server for electronic component research, BOM analysis, and sourcing comparison"
readme = "README.md"
requires-python = ">=3.12"
keywords = [
  "mcp",
  "model-context-protocol",
  "digikey",
  "mouser",
  "electronics",
  "bill-of-materials",
  "component-sourcing",
]
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.52.3",
  "requests==2.34.2",
  "pydantic==2.13.4",
  "httpx==0.28.1",
  "fastmcp==3.4.4",
]

[project.scripts]
partuno-mcp = "partuno:main"

[project.urls]
Homepage = "https://github.com/JPMarhefka/Partuno"
Repository = "https://github.com/JPMarhefka/Partuno"
Documentation = "https://github.com/JPMarhefka/Partuno#readme"
Issues = "https://github.com/JPMarhefka/Partuno/issues"

[tool.setuptools]
py-modules = [
  "app",
  "client",
  "config",
  "credentials",
  "distributor_models",
  "distributors",
  "identity",
  "main",
  "mcp_server",
  "models",
  "mouser_client",
  "mouser_mcp",
  "mouser_services",
  "multi_distributor",
  "normalization",
  "partuno",
  "rest_auth",
  "services",
]
